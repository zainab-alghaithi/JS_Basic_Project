<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive API Page</title>
  <style>
    /* Modern Light Theme */
    body { 
      background: #f7f9fc; /* Very light blue-gray background */
      font-family: 'Segoe UI', sans-serif; 
      margin: 0; 
      padding: 20px; 
      color: #333;
    }
    .container { 
      max-width: 800px; 
      margin: 0 auto; 
      background: #ffffff; 
      border: 1px solid #e0e0e0; 
      border-radius: 8px; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      padding: 20px;
    }
    h1, h2 { 
      text-align: center; 
      color: #444;
    }
    button, input, textarea { 
      padding: 10px; 
      margin: 8px; 
      border: 1px solid #ccd0d5; 
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }
    button { 
      background: #2196F3; 
      color: #fff; 
      border: none; 
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover { 
      background: #1976D2;
    }
    input, textarea {
      background: #fff;
    }
    ul { 
      list-style: none;
      padding: 0;
    }
    li { 
      background: #fafafa; 
      margin: 5px 0; 
      padding: 10px; 
      border: 1px solid #e0e0e0; 
      border-radius: 4px;
    }
    .output { 
      margin-top: 10px; 
      padding: 10px; 
      border: 1px solid #e0e0e0; 
      background: #fff; 
      border-radius: 4px;
    }
    form { 
      margin-top: 20px; 
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Interactive API Page</h1>

    <!-- 1. Show Users -->
    <section>
      <button id="loadUsersBtn">Load Users</button>
      <div id="usersOutput" class="output"></div>
    </section>

    <!-- 2. Show Posts -->
    <section>
      <button id="loadPostsBtn">Load Posts</button>
      <div id="postsOutput" class="output"></div>
    </section>

    <!-- 3. Add a Post -->
    <section>
      <h2>Add a New Post</h2>
      <form id="addPostForm">
        <input type="text" id="postTitle" placeholder="Title" required><br>
        <textarea id="postBody" rows="4" placeholder="Body" required></textarea><br>
        <button type="submit">Submit Post</button>
      </form>
      <div id="newPostOutput" class="output"></div>
    </section>

    <!-- 4. Show Comments for a Post -->
    <section>
      <h2>Load Comments for a Post</h2>
      <input type="number" id="postIdInput" placeholder="Enter Post ID" required>
      <button id="loadCommentsBtn">Load Comments</button>
      <div id="commentsOutput" class="output"></div>
    </section>
  </div>
  
  <script>
    // 1. Show Users: Fetch and display users from API
    document.getElementById('loadUsersBtn').addEventListener('click', () => {
      fetch('https://jsonplaceholder.typicode.com/users')
        .then(response => response.json())
        .then(users => {
          const usersOutput = document.getElementById('usersOutput');
          usersOutput.innerHTML = '<ul>' + users.map(user => 
            `<li>
               <strong>${user.name}</strong><br>
               Email: ${user.email}<br>
               Company: ${user.company.name}
             </li>`
          ).join('') + '</ul>';
        })
        .catch(error => console.error('Error loading users:', error));
    });

    // 2. Show Posts: Fetch and display posts from API
    document.getElementById('loadPostsBtn').addEventListener('click', () => {
      fetch('https://jsonplaceholder.typicode.com/posts')
        .then(response => response.json())
        .then(posts => {
          const postsOutput = document.getElementById('postsOutput');
          postsOutput.innerHTML = '<ul>' + posts.map(post => 
            `<li>
               <strong>${post.title}</strong><br>
               ${post.body}
             </li>`
          ).join('') + '</ul>';
        })
        .catch(error => console.error('Error loading posts:', error));
    });

    // 3. Add a Post: Send a POST request on form submission
    document.getElementById('addPostForm').addEventListener('submit', event => {
      event.preventDefault();
      const title = document.getElementById('postTitle').value;
      const body = document.getElementById('postBody').value;
      
      fetch('https://jsonplaceholder.typicode.com/posts', {
         method: 'POST',
         headers: { 'Content-Type': 'application/json' },
         body: JSON.stringify({ title, body })
      })
      .then(response => response.json())
      .then(newPost => {
         const newPostOutput = document.getElementById('newPostOutput');
         newPostOutput.innerHTML = `
           <p><strong>Post Added Successfully!</strong></p>
           <p>ID: ${newPost.id}</p>
           <p>Title: ${newPost.title}</p>
           <p>Body: ${newPost.body}</p>
         `;
      })
      .catch(error => console.error('Error adding post:', error));
    });

    // 4. Show Comments for a Post: Fetch and display comments based on given Post ID
    document.getElementById('loadCommentsBtn').addEventListener('click', () => {
      const postId = document.getElementById('postIdInput').value;
      if (!postId) { alert('Please enter a valid Post ID'); return; }
      
      fetch(`https://jsonplaceholder.typicode.com/posts/${postId}/comments`)
        .then(response => response.json())
        .then(comments => {
          const commentsOutput = document.getElementById('commentsOutput');
          commentsOutput.innerHTML = '<ul>' + comments.map(comment => 
            `<li>
               <strong>${comment.name}</strong><br>
               ${comment.body}
             </li>`
          ).join('') + '</ul>';
        })
        .catch(error => console.error('Error loading comments:', error));
    });
  </script>
</body>
</html>
