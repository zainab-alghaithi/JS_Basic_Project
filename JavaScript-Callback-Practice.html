<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Callback Practice</title>
    <style>
        body {
            background-color: #f8f8f8;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        input[type="number"],
        input[type="text"] {
            width: 60%;
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #007BFF;
            color: #fff;
            border: none;
            padding: 10px 20px;
            margin: 10px 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        p {
            font-size: 16px;
            color: #555;
        }
        .section {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JavaScript Callback Practice</h1>
    </div>
    <script>
        function greet(name, callback) {
            callback(name);
        }
        greet("Alice", name => console.log(`Hello, ${name}!`));

        function calculate(a, b, operation) {
            return operation(a, b);
        }
        console.log("Addition:", calculate(5,3, (a,b) => a + b));
        console.log("Subtraction:", calculate(5,3, (a,b) => a - b));
        console.log("Multiplication:", calculate(5,3, (a,b) => a * b));
        console.log("Division:", calculate(5,3, (a,b) => a / b));

        function processArray(arr, callback) {
            return arr.map(callback);
        }
        console.log("Doubled:", processArray([1,2,3], n => n * 2));
        console.log("Uppercase:", processArray(["apple","banana","cherry"], s => s.toUpperCase()));

        function getData(callback) {
            const data = { id: 1, name: "John Doe", age: 30 };
            setTimeout(() => callback(data), 1000);
        }
        getData(data => console.log("Received:", data));

        function login(username, password, callback) {
            setTimeout(() => callback({ userId: 1, username }), 1000);
        }
        function fetchUser(user, callback) {
            setTimeout(() => callback({ ...user, fullName: "Alice Johnson" }), 1000);
        }
        function fetchSettings(user, callback) {
            setTimeout(() => callback({ theme: "dark", language: "en" }), 1000);
        }
        login("Alice", "password123", user => {
            console.log("Logged in:", user);
            fetchUser(user, userDetails => {
                console.log("User details:", userDetails);
                fetchSettings(userDetails, settings => {
                    console.log("User settings:", settings);
                });
            });
        });

        function divide(a, b, successCallback, errorCallback) {
            b === 0 ? errorCallback("Error: Division by zero") : successCallback(a / b);
        }
        divide(10, 2, result => console.log("Result:", result), error => console.log(error));
        divide(10, 0, result => console.log("Result:", result), error => console.log(error));
    </script>
</body>
</html>
