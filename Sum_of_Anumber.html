<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sum of Numbers</title>
    <style>
        body {
            background-color: #f8f8f8;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        input[type="number"],
        input[type="text"] {
            width: 60%;
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #007BFF;
            color: #fff;
            border: none;
            padding: 10px 20px;
            margin: 10px 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        p {
            font-size: 16px;
            color: #555;
        }
        .section {
            margin-bottom: 30px;
        }
    </style>
</head>    

<body>
    <div class="container">
        <!-- Even or Odd Checker -->
        <div class="section">
            <h1>Even or Odd Checker</h1>
            <input type="number" id="numberInput" placeholder="Enter a number" />
            <button onclick="checkEvenOdd()">Check</button>
            <p id="result"></p>
        </div>
     
        <!-- Sum of Numbers 1 to N -->
        <div class="section">
            <h1>Sum of Numbers 1 to N</h1>
            <input type="number" id="sumNumber" placeholder="Write a number" />
            <button onclick="TheSum()">The total sum of a number</button>
            <p id="resultsum"></p>
        </div>

        <!-- Fizz Buzz -->
        <div class="section">
            <h1>FizzBuzz from 1-100</h1>
            <button onclick="FizzBuzz()">FizzBuzz</button>
            <p id="fizzbuzzResult" style="white-space: pre-wrap;"></p>
        </div>
         
        <!-- Find the largest number -->
        <div class="section">
            <h1>Find the largest number</h1>
            <input type="text" id="arrayInput" placeholder="Enter numbers separated by commas" />
            <button onclick="findLargest()">Find the largest Number</button>
            <p id="TheLargest"></p>
        </div>
        
        <!-- Count Vowels in a String -->
        <div class="section">
            <h1>Count Vowels in a String</h1>
            <input type="text" id="stringInput" placeholder="Please enter a string" />
            <button onclick="countVowels()">Count Vowels</button>
            <p id="vowelResult"></p>
        </div>
    </div>

    <script>
        // Even or Odd Checker
        function checkEvenOdd() {
            const num = parseInt(document.getElementById('numberInput').value, 10);
            const resultElement = document.getElementById('result');

            if (isNaN(num)) {
                resultElement.innerText = "Please enter a valid number.";
                return;
            } 
            resultElement.innerText = num % 2 === 0 ? `${num} is even.` : `${num} is odd.`;
        }

        // This function calculates the sum of numbers from 1 up to the entered value.
        function TheSum() {
            const n = parseInt(document.getElementById('sumNumber').value, 10);
            const resultElement = document.getElementById('resultsum');

            if (isNaN(n) || n < 1) {
                resultElement.innerText = "Please enter a valid positive number.";
                return;
            }
            
            let sumTotal = 0;
            // Loop from 1 up to n and add each number.
            for (let i = 1; i <= n; i++){
                sumTotal += i;
            }
            resultElement.innerText = `The sum of numbers from 1 to ${n} is ${sumTotal}`;
        }

        // FizzBuzz from 1 to 100
        function FizzBuzz(){
            let output = "";
            for (let i = 1; i <= 100; i++){
                if (i % 3 === 0 && i % 5 === 0) {
                    output += "FizzBuzz\n";
                } else if (i % 3 === 0) {
                    output += "Fizz\n";
                } else if (i % 5 === 0) {
                    output += "Buzz\n";
                } else {
                    output += i + "\n";
                }
            }
            document.getElementById('fizzbuzzResult').innerText = output;
        }
         
        // Find the Largest Number in an Array
        function findLargest(){
            const input = document.getElementById('arrayInput').value;
            const resultElement = document.getElementById('TheLargest');
            if (!input) {
                resultElement.innerText = "Please enter some numbers separated by commas.";
                return;
            }
            const parts = input.split(',');
            const numbers = parts.map(item => parseFloat(item.trim()));
            if (numbers.some(num => isNaN(num))) {
                resultElement.innerText = "Ensure all inputs are valid numbers.";
                return;
            }
            const largest = Math.max(...numbers);
            resultElement.innerText = `The largest number is ${largest}.`;
        }

        // Count Vowels in a String
        function countVowels() {
            const str = document.getElementById('stringInput').value;
            const resultElement = document.getElementById('vowelResult');
            if (!str) {
                resultElement.innerText = "Please enter a string.";
                return;
            }
            const vowels = "aeiouAEIOU";
            let count = 0;
            for (const char of str) {
                if (vowels.indexOf(char) !== -1) {
                    count++;
                }
            }
            resultElement.innerText = `The string has ${count} vowel(s).`;
        }
    </script>
    
</body>
</html>
